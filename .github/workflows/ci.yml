name: Companion checks
on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build overlay, regression tests, and lint
        run: bash gradlew :overlay:assembleDebug :overlay:testDebugUnitTest :overlay:lintDebug --max-workers=3 --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: companion-checks
          path: |
            overlay/build/outputs/apk/debug/*.apk
            overlay/build/reports/tests/
            overlay/build/reports/lint-results-debug.*
